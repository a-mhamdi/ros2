services:
  ros2:
    image: abmhamdi/ros2
    container_name: ros2_container
    privileged: true
    network_mode: "host"
    devices:
      - /dev/dri
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true # keep stdin open
    tty: true # allocate a pseudo-tty
